<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ t.login }} - {{ t.app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- 🌿 Navbar -->
    <nav class="bg-white/80 backdrop-blur-md shadow-md fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-600">🌿 {{ t.app_name }}</h1>
            <div class="flex items-center gap-3">
                    <select onchange="window.location='/set_language/'+this.value" class="border border-green-400 text-green-700 px-2 py-1 rounded text-sm">
                        <option value="en" {% if current_lang == 'en' %}selected{% endif %}>English</option>
                        <option value="hi" {% if current_lang == 'hi' %}selected{% endif %}>हिन्दी</option>
                        <option value="kn" {% if current_lang == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
                    </select>
                    <a href="/" class="text-green-700 font-semibold hover:underline">{{ t.home }}</a>
                </div>
        </div>
    </nav>

    <!-- 🌄 Background -->
    <div class="min-h-screen flex items-center justify-center bg-cover bg-center pt-24"
        style="background-image: url('https://images.unsplash.com/photo-1471193945509-9ad0617afabf');">

        <!-- 🌟 Card -->
        <div class="bg-white/90 backdrop-blur-lg p-10 rounded-2xl shadow-2xl w-full max-w-md">

            <h2 class="text-3xl font-bold text-center text-green-700 mb-6">
                {{ t.login_to }}
            </h2>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
            <p class="text-center mb-3 text-{{ 'green' if category=='success' else 'red' }}">
                {{ msg }}
            </p>
            {% endfor %}
            {% endwith %}

            <!-- FORM -->
            <form action="/login" method="post" class="space-y-5">

                <!-- Role Selection -->
                <select name="role" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-400">
                    <option value="">{{ t.select_role }}</option>
                    <option value="farmer">{{ t.farmer }}</option>
                    <option value="consumer">{{ t.consumer }}</option>
                    <option value="retailer">{{ t.retailer }}</option>
                    <option value="admin">{{ t.admin }}</option>
                </select>

                <!-- Email -->
                <input type="email" name="email" placeholder="{{ t.email }}"
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-400" required>

                <!-- Password -->
                <input type="password" name="password" placeholder="{{ t.password }}"
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-400" required>

                <!-- Button -->
                <button type="submit"
                    class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700 transition">
                    {{ t.login }}
                </button>

            </form>

            <!-- Links -->
            <p class="text-center mt-5">
                {{ t.new_farmer }}
                <a href="/register_farmer" class="text-green-600 font-semibold hover:underline">{{ t.register }}</a>
            </p>

        </div>
    </div>

</body>

</html>
