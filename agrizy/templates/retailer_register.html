<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Retailer Register - Agrizy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav class="bg-white/80 backdrop-blur-md shadow-md fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-600">🌿 {{ t.app_name }}</h1>
            <div class="flex items-center gap-3">
                    <select onchange="window.location='/set_language/'+this.value" class="border border-green-400 text-green-700 px-2 py-1 rounded text-sm">
                        <option value="en" {% if current_lang == 'en' %}selected{% endif %}>English</option>
                        <option value="hi" {% if current_lang == 'hi' %}selected{% endif %}>हिन्दी</option>
                        <option value="kn" {% if current_lang == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
                    </select>
                    <a href="/" class="text-green-700 font-semibold hover:underline">{{ t.home }}</a>
                </div>
        </div>
    </nav>

    <div class="min-h-screen flex items-center justify-center bg-cover bg-center"
        style="background-image: url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6');">

        <div class="bg-white/90 p-10 rounded-xl shadow-lg w-full max-w-xl">

            <h2 class="text-3xl font-bold text-green-700 mb-6 text-center">
                Retailer Registration 🏪
            </h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
            <p class="text-center mb-3 text-{{ 'green' if category=='success' else 'red' }}">
                {{ msg }}
            </p>
            {% endfor %}
            {% endwith %}

            <form action="/save_retailer" method="post" class="grid grid-cols-2 gap-4">

                <input type="text" name="name" placeholder="Full Name" class="p-3 border rounded" required>
                <input type="email" name="email" placeholder="Email" class="p-3 border rounded" required>

                <input type="text" name="phone" placeholder="Phone"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="10" class="p-3 border rounded"
                    required>

                <input type="text" name="shop_name" placeholder="Shop Name" class="p-3 border rounded" required>

                <input type="text" name="state" placeholder="State" class="p-3 border rounded" required>

                <input type="text" name="city" placeholder="City" class="p-3 border rounded" required>

                <input type="text" name="pincode" placeholder="Pincode"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="6" class="p-3 border rounded"
                    required>

                <input type="password" name="password" placeholder="Password" class="p-3 border rounded col-span-2"
                    required>

                <button class="col-span-2 bg-green-600 text-white p-3 rounded hover:bg-green-700">
                    Register
                </button>

            </form>

            <p class="text-center mt-4">
                Already have account? <a href="/login" class="text-green-600">Login</a>
            </p>

        </div>
    </div>

</body>

</html>
