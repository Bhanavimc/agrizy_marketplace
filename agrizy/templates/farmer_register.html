<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Farmer Registration - Agrizy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- 🌿 Navbar (Fixed + Visible) -->
    <nav class="bg-white/80 backdrop-blur-md shadow-md fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-600">🌿 {{ t.app_name }}</h1>
            <div class="flex items-center gap-3">
                    <select onchange="window.location='/set_language/'+this.value" class="border border-green-400 text-green-700 px-2 py-1 rounded text-sm">
                        <option value="en" {% if current_lang == 'en' %}selected{% endif %}>English</option>
                        <option value="hi" {% if current_lang == 'hi' %}selected{% endif %}>हिन्दी</option>
                        <option value="kn" {% if current_lang == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
                    </select>
                    <a href="/" class="text-green-700 font-semibold hover:underline">{{ t.home }}</a>
                </div>
        </div>
    </nav>

    <!-- 🌄 Background -->
    <div class="min-h-screen flex items-center justify-center bg-cover bg-center pt-24"
        style="background-image: url('https://images.unsplash.com/photo-1471193945509-9ad0617afabf');">

        <!-- 🌟 Glass Card -->
        <div class="bg-white/90 backdrop-blur-lg p-10 rounded-2xl shadow-2xl w-full max-w-3xl">

            <h2 class="text-4xl font-bold text-center text-green-700 mb-8">
                Farmer Registration
            </h2>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
            <p class="text-center mb-4 text-lg text-{{ 'green' if category=='success' else 'red' }}">
                {{ msg }}
            </p>
            {% endfor %}
            {% endwith %}

            <!-- FORM -->
            <form action="/save_farmer" method="post" enctype="multipart/form-data"
                class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <input type="text" name="name" placeholder="Full Name"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <input type="email" name="email" placeholder="Email"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <input type="text" name="phone" placeholder="Phone Number"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="10"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <input type="text" name="aadhar" placeholder="Aadhar Number"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="12"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <input type="text" name="state" placeholder="State"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <input type="text" name="city" placeholder="City / Village"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <input type="text" name="pincode" placeholder="Pincode"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="6"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <input type="password" name="password" placeholder="Password"
                    class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400 outline-none" required>

                <!-- QR Upload Full Width -->
                <div class="col-span-1 md:col-span-2">
                    <label class="block mb-2 font-semibold text-gray-700">Upload Payment QR</label>
                    <input type="file" name="qr_image" accept="image/*" class="w-full p-3 border rounded-lg bg-white"
                        required>
                </div>

                <!-- Submit Button Full Width -->
                <div class="col-span-1 md:col-span-2">
                    <button type="submit"
                        class="w-full bg-green-600 text-white p-3 rounded-lg text-lg font-semibold hover:bg-green-700 transition">
                        Register
                    </button>
                </div>

            </form>

            <!-- Login Link -->
            <p class="text-center mt-6 text-lg">
                Already have an account?
                <a href="/login" class="text-green-600 font-semibold hover:underline">Login</a>
            </p>

        </div>
    </div>

</body>

</html>
