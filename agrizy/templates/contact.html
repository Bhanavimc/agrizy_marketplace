<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact - Agrizy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- 🌿 Navbar -->
    <nav class="bg-white/80 backdrop-blur-md shadow-md fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-600">🌿 {{ t.app_name }}</h1>
            <div class="flex items-center space-x-6">
                <a href="/" class="text-gray-700 hover:text-green-600">{{ t.home }}</a>
                <a href="/about" class="text-gray-700 hover:text-green-600">{{ t.about }}</a>
                <a href="/contact" class="text-green-600 font-semibold">{{ t.contact }}</a>
                <select onchange="window.location='/set_language/'+this.value" class="border border-green-400 text-green-700 px-2 py-1 rounded text-sm">
                    <option value="en" {% if current_lang == 'en' %}selected{% endif %}>English</option>
                    <option value="hi" {% if current_lang == 'hi' %}selected{% endif %}>हिन्दी</option>
                    <option value="kn" {% if current_lang == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
                </select>
                <a href="/login" class="bg-green-600 text-white px-4 py-2 rounded">{{ t.login }}</a>
            </div>
        </div>
    </nav>

    <!-- 🌄 Hero -->
    <section class="h-[50vh] flex items-center justify-center text-white relative">

        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1471193945509-9ad0617afabf" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black opacity-50"></div>
        </div>

        <div class="relative z-10 text-center">
            <h1 class="text-4xl font-bold">Get in Touch 📞</h1>
            <p class="mt-2">We’re here to help you</p>
        </div>

    </section>

    <!-- 📞 Contact Info -->
    <section class="py-16 px-6 max-w-5xl mx-auto">

        <div class="grid md:grid-cols-3 gap-8 text-center">

            <!-- Phone -->
            <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
                <h3 class="text-xl font-bold text-green-600 mb-2">📱 Phone</h3>
                <p class="text-gray-700">+91 98765 43210</p>
            </div>

            <!-- Email -->
            <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
                <h3 class="text-xl font-bold text-green-600 mb-2">📧 Email</h3>
                <p class="text-gray-700">support@agrizy.com</p>
            </div>

            <!-- Address -->
            <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
                <h3 class="text-xl font-bold text-green-600 mb-2">📍 Address</h3>
                <p class="text-gray-700">
                    Bengaluru, Karnataka, India
                </p>
            </div>

        </div>

    </section>

    <!-- 🌐 Social Links -->
    <section class="text-center pb-12">

        <h2 class="text-2xl font-bold text-green-700 mb-4">
            Follow Us 🌍
        </h2>

        <div class="space-x-6 text-lg">
            <a href="#" class="text-blue-600 hover:underline">Facebook</a>
            <a href="#" class="text-pink-500 hover:underline">Instagram</a>
            <a href="#" class="text-blue-400 hover:underline">Twitter</a>
        </div>

    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-6">
        <p>© 2026 Agrizy | Built with ❤️ for Farmers</p>
    </footer>

</body>

</html>
