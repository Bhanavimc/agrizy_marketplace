<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My Orders - Agrizy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- 🌿 Navbar -->
    <div
        class="bg-gradient-to-r from-green-600 to-green-700 text-white shadow-lg p-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold">🌿 {{ t.app_name }}</h1>

        <div class="flex items-center gap-6">

            <a href="/retailer_dashboard" class="hover:text-gray-200">{{ t.shop }}</a>

            <a href="/my_orders">
                {{ t.orders }} 📦
            </a>

            <a href="/cart" class="bg-white text-green-700 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100">
                Cart 🛒
            </a>

            <select onchange="window.location='/set_language/'+this.value" class="bg-green-800 text-white border border-green-400 px-2 py-1 rounded text-sm">
                <option value="en" {% if current_lang == 'en' %}selected{% endif %}>English</option>
                <option value="hi" {% if current_lang == 'hi' %}selected{% endif %}>हिन्दी</option>
                <option value="kn" {% if current_lang == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
            </select>

            <a href="/logout" class="bg-red-500 px-3 py-1 rounded-lg hover:bg-red-600">
                Logout
            </a>

        </div>
    </div>

    <!-- 📦 Orders Section -->
    <div class="p-6 max-w-5xl mx-auto">

        <h2 class="text-2xl font-bold mb-6">My Orders 📦</h2>

        {% if orders|length > 0 %}

        <table class="w-full bg-white shadow-md rounded overflow-hidden">

            <tr class="bg-green-600 text-white">
                <th class="p-3">Product</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Date</th>
            </tr>

            {% for o in orders %}
            <tr class="text-center border-b hover:bg-gray-50">
                <td class="p-3">{{ o[0] }}</td>
                <td>{{ o[1] }}</td>
                <td class="font-semibold">₹{{ o[2] }}</td>
                <td class="text-gray-500">{{ o[3] }}</td>
            </tr>
            {% endfor %}

        </table>

        {% else %}

        <!-- Empty Orders -->
        <div class="text-center mt-20">
            <p class="text-gray-600 text-lg">No orders yet 😔</p>
            <a href="/consumer_dashboard" class="mt-4 inline-block bg-green-600 text-white px-6 py-2 rounded">
                Start Shopping
            </a>
        </div>

        {% endif %}

    </div>

</body>

</html>
